name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR: agrupado por número do PR - um commit novo cancela a validação em
  # andamento do commit anterior do MESMO PR. Push em main/workflow_dispatch:
  # agrupado por SHA - nunca cancela a validação de um commit já incorporado
  # a main nem uma execução manual independente (ver ADR-0012).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gate rapido: restore, build e as camadas de teste que nao dependem de
  # infraestrutura (Docker/Testcontainers) - unitario, contrato e
  # arquitetura. Falha aqui aborta os gates mais caros abaixo (ver "needs").
  fast-quality-gate:
    name: Fast quality gate (unit, contract, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar .NET SDK 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Exibir versões do Docker
        run: |
          docker --version
          docker compose version

      - name: Build
        run: docker compose run --rm --no-deps dotnet-sdk dotnet build BancoCarrefour.sln

      - name: Testes unitários (Ledger/Consolidation Domain e Application)
        run: |
          docker compose run --rm --no-deps dotnet-sdk sh -c "
            dotnet test tests/Ledger.Domain.Tests/Ledger.Domain.Tests.csproj --no-build --logger trx --results-directory /workspace/test-results &&
            dotnet test tests/Ledger.Application.Tests/Ledger.Application.Tests.csproj --no-build --logger trx --results-directory /workspace/test-results &&
            dotnet test tests/Consolidation.Domain.Tests/Consolidation.Domain.Tests.csproj --no-build --logger trx --results-directory /workspace/test-results &&
            dotnet test tests/Consolidation.Application.Tests/Consolidation.Application.Tests.csproj --no-build --logger trx --results-directory /workspace/test-results
          "

      - name: Testes de contrato
        run: docker compose run --rm --no-deps dotnet-sdk dotnet test tests/ContractTests/ContractTests.csproj --no-build --logger trx --results-directory /workspace/test-results

      # Testes de arquitetura rodam NATIVAMENTE no runner (nao via "docker
      # compose run" no container-irmao "dotnet-sdk"). Varias dessas provas
      # de governanca chamam "git ls-files" real contra o checkout (higiene
      # de repositorio, secrets, portfolio de ADRs) e "scripts/ci/validate-release-manifest.sh"
      # (que exige python3) - o container-irmao monta o checkout em
      # /workspace mas nao tem git nem python3 instalados, e mesmo com
      # ambos presentes o .git do host, montado num container com outro
      # UID, dispara "detected dubious ownership" (nunca contornado com
      # "safe.directory *" global). O runner ubuntu-latest ja traz git e
      # python3 nativamente, e o build feito acima pelo container-irmao
      # grava os binarios direto no checkout (bind mount ".:/workspace"),
      # entao o "dotnet test --no-build" nativo reaproveita esse build sem
      # recompilar.
      - name: Preflight (git, python3, dotnet) para os testes de arquitetura
        run: |
          git --version
          python3 --version
          dotnet --info
          git rev-parse --show-toplevel
          git ls-files > /dev/null

      - name: Testes de arquitetura (nativo no runner)
        run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --no-build --logger trx --results-directory test-results

      - name: Verificar whitespace
        run: git diff --check

      - name: Governança de migração expand-and-contract (EF Core)
        run: sh scripts/ci/validate-migration-governance.sh

      - name: Publicar resultados de teste (TRX)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-quality-gate-trx
          path: test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose down

  # Ledger.IntegrationTests e Consolidation.IntegrationTests (Testcontainers
  # real - PostgreSQL e LocalStack efêmeros, não a stack do docker-compose).
  integration-gate:
    name: Integration gate (Ledger e Consolidation)
    needs: fast-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: docker compose run --rm --no-deps dotnet-sdk dotnet build BancoCarrefour.sln

      - name: Ledger.IntegrationTests
        run: |
          docker compose run --rm --no-deps \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            dotnet-sdk dotnet test tests/Ledger.IntegrationTests/Ledger.IntegrationTests.csproj --no-build --logger trx --results-directory /workspace/test-results

      - name: Consolidation.IntegrationTests (inclui a prova de isolamento)
        run: |
          docker compose run --rm --no-deps \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            dotnet-sdk dotnet test tests/Consolidation.IntegrationTests/Consolidation.IntegrationTests.csproj --no-build --logger trx --results-directory /workspace/test-results

      - name: Publicar resultados de teste (TRX)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-gate-trx
          path: test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose down

  # Security.IntegrationTests: identidade/borda OIDC real (Keycloak),
  # TLS/WAF, menor privilégio PostgreSQL, Secrets Manager/SSM/KMS/IAM via
  # LocalStack. Isolado dos demais gates - é o mais pesado e não deve
  # sobrepor execução com o integration-gate (containers próprios via
  # Testcontainers, mas evitar rodar em paralelo com outro job pesado no
  # mesmo runner reduz ruído de recursos).
  #
  # este job roda o processo de teste.NET
  # NATIVAMENTE no runner (actions/setup-dotnet oficial, pinado por SHA),
  # em vez de dentro do container-irmao "dotnet-sdk" via "docker compose
  # run". Esta suite cria containers Keycloak/PostgreSQL ad-hoc via
  # Testcontainers e acessa suas portas publicadas via "127.0.0.1"
  # diretamente (ver tests/Security.IntegrationTests/Identity/IdentityFixture.cs)
  # - quando o processo de teste roda DENTRO de um container-irmao, esse
  # "127.0.0.1" aponta para o loopback do PROPRIO container-irmao, isolado
  # por namespace de rede do Docker do container Keycloak - reproduzido e
  # confirmado localmente (101 de 105 testes falhavam por timeout de
  # readiness do Keycloak nesse modo; os mesmos 74 testes passam 100% ao
  # rodar nativamente, matching a topologia real do runner). Os demais
  # gates (fast-quality-gate, integration-gate) nao tem esse problema
  # porque usam TESTCONTAINERS_HOST_OVERRIDE corretamente - ver
  # docs/security/dependencias-e-supply-chain.md para o detalhe completo.
  security-gate:
    name: Security gate (identidade, borda, secrets)
    needs: fast-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar .NET SDK 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BancoCarrefour.sln

      - name: Build
        run: dotnet build BancoCarrefour.sln --no-restore

      # AuthenticatedEdgeFlowFixture (tests/Security.IntegrationTests/Edge)
      # sobe banco-carrefour-ledger-api:local e banco-carrefour-consolidation-api:local
      # via Testcontainers, direto do daemon Docker local - GitHub Actions
      # roda cada job em runner isolado, sem compartilhar filesystem nem
      # daemon Docker com o job "image-gate" (que builda as 5 imagens em
      # outro runner); sem essa imagem local, o Testcontainers tenta um
      # "docker pull" e falha com "pull access denied" (a imagem nunca foi
      # publicada em nenhum registry - é build-once local, ver ADR-0013).
      # Buildamos aqui só as 2 imagens que este teste realmente usa (não
      # as 5), via as definições canônicas do docker-compose.yml.
      - name: Build das imagens locais exigidas por Security.IntegrationTests (ledger-api, consolidation-api)
        run: docker compose build ledger-api consolidation-api

      - name: Verificar que as imagens locais existem antes dos testes
        run: |
          docker image inspect banco-carrefour-ledger-api:local >/dev/null
          docker image inspect banco-carrefour-consolidation-api:local >/dev/null

      - name: Security.IntegrationTests (processo nativo no runner)
        run: dotnet test tests/Security.IntegrationTests/Security.IntegrationTests.csproj --no-build --logger trx --results-directory test-results

      - name: Publicar resultados de teste (TRX)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-gate-trx
          path: test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # Builda as 5 imagens reais (4 componentes de negocio - Ledger.Api,
  # Ledger.OutboxPublisher, Consolidation.Api, Consolidation.Worker - e 1
  # artefato operacional - MigrationRunner, nunca um 5o workload de
  # negocio, ver ADR-0006/ADR-0015) e confirma que nenhuma roda como root
  # por padrão. Não publica nenhuma imagem neste bloco.
  image-gate:
    name: Image gate (build e verificação non-root)
    needs: fast-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Metrica de capacidade compacta (uma linha, antes/depois) em torno do
      # job mais pesado deste workflow (build de 5 imagens Docker) - Large
      # Cycle A item 4.8. Runners hospedados sao efemeros (disco descartado
      # ao final do job), entao isto e apenas visibilidade/tendencia entre
      # execucoes via log do workflow, nunca um gate (o gate de capacidade
      # fica em scripts/ci/capacity-preflight.sh, para uso local).
      - name: Metrica de capacidade (antes do build)
        run: df -h . | tail -n 1

      - name: Build das 5 imagens (uma única vez - build once)
        run: sh scripts/ci/build-images-for-supply-chain.sh

      - name: Metrica de capacidade (depois do build)
        run: df -h . | tail -n 1

      - name: Verificação non-root (a partir do manifesto - nunca reconstrói)
        run: sh scripts/ci/verify-nonroot-from-manifest.sh

  # Smoke de desempenho: sobe a stack real, executa 50 RPS sustentados
  # contra o Consolidation.Api real (medindo a capacidade do serviço, não o
  # rate limit do WAF na borda - ver ADR-0012) e reprova o job se a taxa de
  # falha elegível exceder 5%. Depende do image-gate (não adianta gastar
  # ~5min de smoke se as imagens nem buildam).
  performance-smoke-gate:
    name: Performance smoke gate (50 RPS)
    needs: [fast-quality-gate, image-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Alvo e limite oficiais da RNF de desempenho (ADR-0012) - explícitos
      # aqui (em vez de só no default do código) para que
      # WorkflowGovernanceArchitectureTests possa confirmar estruturalmente
      # que o gate de CI continua travado em 50 RPS / 5% de falha elegível.
      LOADTEST_RPS: "50"
      LOADTEST_MAX_FAILURE_RATE: "0.05"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar material de segurança local (processo oficial)
        run: sh scripts/security/bootstrap-local-security.sh

      - name: Executar smoke de 50 RPS
        run: sh scripts/ci/run-performance-smoke.sh

      - name: Publicar sumário no job summary
        if: always()
        run: |
          if [ -f artifacts/performance-smoke.md ]; then
            cat artifacts/performance-smoke.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhuma evidência de desempenho gerada (falha antes da coleta de resultado)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar evidência de desempenho
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-smoke-evidence
          path: |
            artifacts/performance-smoke.json
            artifacts/performance-smoke.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down
